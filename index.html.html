    function toggleTodayChartRange() {
      todayChartRange = todayChartRange === 7 ? 14 : 7;
      updateTodaySummaryInPlace();
      const btnSpan = document.querySelector('#today-chart-wrap')?.parentElement?.querySelector('button span');
      if (btnSpan) btnSpan.textContent = `${todayChartRange} ngày`;
    }

    function toggleBacklogExpand() {
      backlogExpanded = !backlogExpanded;
      renderApp();
    }

    function moveAllBacklogToToday() {
      const todayISO = formatDateISO(getTodayDateObj());
      let count = 0;
      appState.tasks.forEach(t => {
        if (t.date < todayISO && !t.done) {
          t.date = todayISO;
          count++;
        }
      });
      saveState();
      renderApp();
      showToast(`Đã chuyển ${count} việc còn tồn vào hôm nay`);
    }

    function moveSingleTaskToToday(id) {
      const todayISO = formatDateISO(getTodayDateObj());
      const t = appState.tasks.find(x => x.id === id);
      if (t) {
        t.date = todayISO;
        saveState();
        renderApp();
        showToast('Đã chuyển việc vào hôm nay');
      }
    }

    function toggleTaskDone(id, evt = null) {
      const t = appState.tasks.find(x => x.id === id);
      if (!t) return;
      const todayISO = formatDateISO(getTodayDateObj());
      const prevPct = getTodaySummaryData().overallPct;
      t.done = !t.done;
      if (t.subtasks && t.subtasks.length > 0 && t.done) {
        t.subtasks.forEach(s => s.done = true);
      }
      playMicroTickSound(t.done);
      if (t.done && evt) {
        triggerMicroSparkle(evt.clientX, evt.clientY);
      }
      saveState();

      if (activeTab === 'today') {
        renderTodayTasksInPlace();
      } else {
        renderApp(false);
      }

      if (t.date === todayISO && t.done && prevPct < 100 && getTodaySummaryData().overallPct === 100) {
        triggerAllTodayCelebration();
      } else if (t.date === todayISO && !t.done) {
        lastCelebratedPerfectDayISO = null;
      }
    }

    function toggleSubtaskDrawer(id) {
      const t = appState.tasks.find(x => x.id === id);
      if (!t) return;
      t._openSubs = !t._openSubs;
      const drawer = document.getElementById(`subdrawer-${id}`);
      if (drawer) drawer.classList.toggle('hidden', !t._openSubs);
    }

    function toggleSubtask(taskId, subId, evt = null) {
      const t = appState.tasks.find(x => x.id === taskId);
      if (!t || !t.subtasks) return;
      const st = t.subtasks.find(s => s.id === subId);
      if (!st) return;
      const todayISO = formatDateISO(getTodayDateObj());
      const prevPct = getTodaySummaryData().overallPct;
      st.done = !st.done;
      t.done = t.subtasks.every(s => s.done);
      playMicroTickSound(st.done);
      if (st.done && evt) {
        triggerMicroSparkle(evt.clientX, evt.clientY);
      }
      saveState();

      if (activeTab === 'today') {
        renderTodayTasksInPlace();
      } else {
        renderApp();
      }

      if (t.date === todayISO && st.done && prevPct < 100 && getTodaySummaryData().overallPct === 100) {
        triggerAllTodayCelebration();
      } else if (t.date === todayISO && !t.done) {
        lastCelebratedPerfectDayISO = null;
      }
    }

    function moveTaskOrder(id, dir) {
      const todayISO = formatDateISO(getTodayDateObj());
      const indices = [];
      appState.tasks.forEach((t, i) => { if (t.date === todayISO) indices.push(i); });
      const posInToday = indices.findIndex(idx => appState.tasks[idx].id === id);
      if (posInToday === -1) return;
      const swapPos = posInToday + dir;
      if (swapPos < 0 || swapPos >= indices.length) return;
      const a = indices[posInToday];
      const b = indices[swapPos];
      const tmp = appState.tasks[a];
      appState.tasks[a] = appState.tasks[b];
      appState.tasks[b] = tmp;
      saveState();
      if (activeTab === 'today') renderTodayTasksInPlace();
      else renderApp();
    }

    function handleQuickAddTodayTask(e) {
      e.preventDefault();
      const input = document.getElementById('quick-today-input');
      const prio = document.getElementById('quick-today-priority');
      const title = input.value.trim();
      if (!title) return;
      appState.tasks.push({
        id: uid('t'),
        title,
        date: formatDateISO(getTodayDateObj()),
        priority: prio.value,
        done: false,
        pomodoroCount: 0,
        subtasks: []
      });
      input.value = '';
      saveState();
      playMicroTickSound(true);
      if (activeTab === 'today') renderTodayTasksInPlace();
      else renderApp();
      showToast('Đã thêm việc hôm nay');
    }

    function handleQuickAddHabit(e) {
      e.preventDefault();
      const input = document.getElementById('quick-habit-input');
      const name = input.value.trim();
      if (!name) return;
      appState.habits.push({ id: uid('h'), name, logs: {} });
      input.value = '';
      saveState();
      playMicroTickSound(true);
      if (activeTab === 'today') renderTodayHabitsInPlace();
      else renderApp();
      showToast('Đã thêm thói quen mới');
    }

      openModal(`

          <div class="flex items-center justify-between">
            <h3 class="text-base font-bold">Thêm công việc mới</h3>
            <button type="button" onclick="closeModal()" class="p-1 opacity-70 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">Tên công việc</label>
            <input id="modal-task-title" required type="text" placeholder="Ví dụ: Hoàn thành báo cáo tuần..." class="planner-input w-full px-3 py-2 text-xs" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">Ngày thực hiện</label>

            </div>
            <div>
              <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">Mức ưu tiên</label>
              <select id="modal-task-prio" class="planner-input w-full px-3 py-2 text-xs">
                <option value="">Bình thường</option>
                <option value="Gấp">Gấp</option>
                <option value="Quan trọng">Quan trọng</option>
              </select>
            </div>
          </div>

    function submitEditTaskModal(e, id) {
      e.preventDefault();
      const t = appState.tasks.find(x => x.id === id);
      if (!t) return;
      t.title = document.getElementById('edit-task-title').value.trim() || t.title;
      t.date = document.getElementById('edit-task-date').value || t.date;
      t.priority = document.getElementById('edit-task-prio').value;
      const lines = document.getElementById('edit-task-subs').value.split('\n').map(s => s.trim()).filter(Boolean);
      const oldMap = {};
      (t.subtasks || []).forEach(s => { oldMap[s.title] = s.done; });
      t.subtasks = lines.map(title => ({ id: uid('st'), title, done: !!oldMap[title] }));
      saveState();
      closeModal();
      renderApp();
      showToast('Đã cập nhật công việc');

      appState.tasks = appState.tasks.filter(x => x.id !== id);

      appState.tasks.push({

        title: r.title,
        date: formatDateISO(getTodayDateObj()),
        priority: r.priority || '',
        done: false,
        pomodoroCount: 0,

      saveState();
      closeModal();

      showToast(`Đã thêm "${r.title}" vào hôm nay`);

      e.preventDefault();
      const title = document.getElementById('rec-title').value.trim();
      const days = Array.from(document.querySelectorAll('.rec-day-cb:checked')).map(el => Number(el.value));

    function getGoalProgress(goal) {
      if (!goal.steps || goal.steps.length === 0) return 0;
      const done = goal.steps.filter(s => s.done).length;
      return Math.round((done / goal.steps.length) * 100);
    }

    function getGoalTimeProgress(goal, todayISO) {
      if (!goal.startDate || !goal.deadline) return 50;
      const total = Math.max(1, daysBetween(goal.startDate, goal.deadline));
      const elapsed = Math.max(0, daysBetween(goal.startDate, todayISO));
      return Math.min(100, Math.round((elapsed / total) * 100));
    }

        return { label: cat.key, value: Math.max(15, avg), count: catGoals.length };

    /* =========================================================================
       3. TAB: THEO DÕI THÓI QUEN (IN-PLACE MATRIX UPDATE)
       ========================================================================= */
    function getHabitMonthInfo() {
      const today = getTodayDateObj();
      const todayISO = formatDateISO(today);
      const viewDate = new Date(today.getFullYear(), today.getMonth() + habitMonthOffset, 1);
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const datesArr = [];
      for (let d = 1; d <= daysInMonth; d++) {
        const dt = new Date(year, month, d);
        const iso = formatDateISO(dt);
        datesArr.push({
          dayNum: d,
          dayName: getDayNameVN(dt),
          iso,
          isToday: iso === todayISO,
          isFuture: iso > todayISO,
          isWeekend: dt.getDay() === 0 || dt.getDay() === 6
        });
      }
      return { todayISO, year, month, daysInMonth, datesArr };
    }

    function updateHabitStatsAndChartInPlace() {
      const { todayISO, datesArr } = getHabitMonthInfo();
      const habits = appState.habits || [];
      const activeDates = datesArr.filter(d => !d.isFuture);
      const totalSlots = habits.length * Math.max(1, activeDates.length);
      let doneSlots = 0;
      activeDates.forEach(d => {
        habits.forEach(h => { if (h.logs && h.logs[d.iso]) doneSlots++; });
      });
      const monthPct = totalSlots > 0 ? Math.round((doneSlots / totalSlots) * 100) : 0;

      let bestStreak = 0;
      let bestStreakHabit = 'Chưa có';
      let bestRate = 0;
      let bestRateHabit = 'Chưa có';

      habits.forEach(h => {
        let cur = 0;
        let maxS = 0;
        let hDone = 0;
        activeDates.forEach(d => {
          if (h.logs && h.logs[d.iso]) {
            cur++;
            hDone++;
            if (cur > maxS) maxS = cur;
          } else {
            cur = 0;
          }
        });
        if (maxS >= bestStreak && maxS > 0) {
          bestStreak = maxS;
          bestStreakHabit = h.name;
        }
        const rate = activeDates.length > 0 ? Math.round((hDone / activeDates.length) * 100) : 0;
        if (rate >= bestRate && hDone > 0) {
          bestRate = rate;
          bestRateHabit = h.name;
        }
      });

      const pctEl = document.getElementById('habit-month-pct');
      if (pctEl) pctEl.textContent = `${monthPct}%`;

      const streakEl = document.getElementById('habit-best-streak');
      if (streakEl) streakEl.innerHTML = `${bestStreak} <span class="text-xs font-normal">ngày</span>`;

      const streakNameEl = document.getElementById('habit-best-streak-name');
      if (streakNameEl) streakNameEl.textContent = bestStreakHabit;

      const rateNameEl = document.getElementById('habit-best-rate-name');
      if (rateNameEl) rateNameEl.textContent = bestRateHabit;

      const rateValEl = document.getElementById('habit-best-rate-val');
      if (rateValEl) rateValEl.textContent = `${bestRate}%`;

      const chartWrap = document.getElementById('habit-chart-wrap');
      if (chartWrap) {
        const displayDates = habitChartRange === '7d' ? activeDates.slice(-7) : datesArr;
        const chartLabels = displayDates.map(d => {
          if (habitChartRange === '7d') return `${d.dayName} ${d.dayNum}`;
          return (d.dayNum === 1 || d.dayNum % 5 === 1 || d.isToday) ? String(d.dayNum) : '';
        });
        const chartSeries = displayDates.map(d => {
          if (d.isFuture) return null;
          return habits.filter(h => h.logs && h.logs[d.iso]).length;
        });

        chartWrap.innerHTML = buildSmoothAreaChartSVG({
          labels: chartLabels,
          primarySeries: chartSeries,
          maxY: Math.max(6, habits.length),
          height: 155,
          highlightLast: false,
          mode: habitChartMode
        });
      }
    }

    function renderHabitsView() {
      const { todayISO, year, month, datesArr } = getHabitMonthInfo();
      const habits = appState.habits || [];
      const activeDates = datesArr.filter(d => !d.isFuture);
      const totalSlots = habits.length * Math.max(1, activeDates.length);
      let doneSlots = 0;
      activeDates.forEach(d => {
        habits.forEach(h => { if (h.logs && h.logs[d.iso]) doneSlots++; });
      });
      const monthPct = totalSlots > 0 ? Math.round((doneSlots / totalSlots) * 100) : 0;

      let bestStreak = 0;
      let bestStreakHabit = 'Chưa có';
      let bestRate = 0;
      let bestRateHabit = 'Chưa có';

      habits.forEach(h => {
        let cur = 0;
        let maxS = 0;
        let hDone = 0;
        activeDates.forEach(d => {
          if (h.logs && h.logs[d.iso]) {
            cur++;
            hDone++;
            if (cur > maxS) maxS = cur;
          } else {
            cur = 0;
          }
        });
        if (maxS >= bestStreak && maxS > 0) {
          bestStreak = maxS;
          bestStreakHabit = h.name;
        }
        const rate = activeDates.length > 0 ? Math.round((hDone / activeDates.length) * 100) : 0;
        if (rate >= bestRate && hDone > 0) {
          bestRate = rate;
          bestRateHabit = h.name;
        }
      });

      const displayDates = habitChartRange === '7d' ? activeDates.slice(-7) : datesArr;
      const chartLabels = displayDates.map(d => {
        if (habitChartRange === '7d') return `${d.dayName} ${d.dayNum}`;
        return (d.dayNum === 1 || d.dayNum % 5 === 1 || d.isToday) ? String(d.dayNum) : '';
      });
      const chartSeries = displayDates.map(d => {
        if (d.isFuture) return null;
        return habits.filter(h => h.logs && h.logs[d.iso]).length;
      });

      return `
        <section class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
          <div>
            <h1 class="text-2xl sm:text-[28px] font-extrabold tracking-tight">Theo dõi thói quen</h1>
            <p class="text-xs sm:text-sm mt-0.5" style="color: var(--text-secondary);">Tháng ${month + 1}/${year}</p>
            <div class="flex items-center gap-2 mt-3">
              <button onclick="changeHabitMonth(-1)" class="planner-pill p-2"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
              <button onclick="changeHabitMonth(0)" class="planner-pill px-3.5 py-1.5 text-xs font-semibold">${habitMonthOffset === 0 ? 'Tháng này' : `Tháng ${month + 1}`}</button>
              <button onclick="changeHabitMonth(1)" class="planner-pill p-2"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>
          </div>

          <div class="planner-card px-5 py-3.5 grid grid-cols-3 gap-4 sm:gap-7">
            <div>
              <div class="text-[10px] uppercase tracking-wider flex items-center gap-1" style="color: var(--text-secondary);">
                <i data-lucide="pie-chart" class="w-3 h-3"></i> CẢ THÁNG
              </div>
              <div id="habit-month-pct" class="text-xl sm:text-2xl font-extrabold mt-1">${monthPct}%</div>
            </div>
            <div>
              <div class="text-[10px] uppercase tracking-wider flex items-center gap-1" style="color: var(--text-secondary);">
                <i data-lucide="flame" class="w-3 h-3"></i> CHUỖI DÀI NHẤT
              </div>
              <div id="habit-best-streak" class="text-xl sm:text-2xl font-extrabold mt-1">${bestStreak} <span class="text-xs font-normal">ngày</span></div>
              <div id="habit-best-streak-name" class="text-[10px] truncate max-w-[110px]" style="color: var(--text-muted);">${escapeHtml(bestStreakHabit)}</div>
            </div>
            <div>
              <div class="text-[10px] uppercase tracking-wider flex items-center gap-1" style="color: var(--text-secondary);">
                <i data-lucide="award" class="w-3 h-3"></i> ĐỀU ĐẶN NHẤT
              </div>
              <div id="habit-best-rate-name" class="text-sm sm:text-base font-extrabold mt-1 truncate max-w-[125px]">${escapeHtml(bestRateHabit)}</div>
              <div id="habit-best-rate-val" class="text-[10px]" style="color: var(--text-muted);">${bestRate}%</div>
            </div>
          </div>
        </section>

        <section class="planner-card p-4 sm:p-5">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2.5">
              <h2 class="text-sm sm:text-base font-bold">Mức hoàn thành theo ngày</h2>
              <button onclick="toggleHabitChartRange()" class="planner-pill px-2.5 py-1 text-xs font-medium flex items-center gap-1">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                <span>${habitChartRange === '1m' ? '1 tháng' : '7 ngày'}</span>
                <i data-lucide="chevron-down" class="w-3 h-3"></i>
              </button>
            </div>

            <div class="flex items-center gap-3">
              <div class="hidden sm:flex items-center gap-3 text-xs" style="color: var(--text-secondary);">
                <span class="flex items-center gap-1"><span class="w-2.5 h-0.5 inline-block" style="background: var(--chart-line);"></span> Đã xong</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-0.5 inline-block" style="background: var(--chart-sub);"></span> Tổng thói quen</span>
              </div>
              <div class="flex items-center p-0.5 rounded-xl border" style="border-color: var(--border-main); background-color: var(--bg-surface-2);">
                <button onclick="setHabitChartMode('line')" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${habitChartMode === 'line' ? 'planner-pill-active' : ''}">Đường</button>
                <button onclick="setHabitChartMode('bar')" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${habitChartMode === 'bar' ? 'planner-pill-active' : ''}">Cột</button>
              </div>
            </div>
          </div>

          <div id="habit-chart-wrap">
            ${buildSmoothAreaChartSVG({
              labels: chartLabels,
              primarySeries: chartSeries,
              maxY: Math.max(6, habits.length),
              height: 155,
              highlightLast: false,
              mode: habitChartMode
            })}
          </div>
        </section>

        <section class="planner-card p-4 sm:p-5">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base sm:text-lg font-bold">Bảng theo dõi</h2>
            <span class="planner-pill px-3 py-1 text-xs font-semibold">Tháng ${month + 1}/${year}</span>
          </div>

          <div class="overflow-x-auto pb-2">
            <table class="w-full border-collapse text-xs">
              <thead>
                <tr>
                  <th class="text-left py-2 pr-4 font-semibold min-w-[185px] sticky left-0 z-10" style="background-color: var(--bg-surface); color: var(--text-secondary);">Thói quen</th>
                  ${datesArr.map(d => `
                    <th class="px-1 py-1.5 text-center min-w-[28px] rounded-t-lg ${d.isToday ? 'bg-white/10' : d.isWeekend ? 'bg-white/[0.03]' : ''}">
                      <div class="text-[9px] font-medium" style="color: ${d.isToday ? 'var(--accent)' : 'var(--text-muted)'};">${d.dayName}</div>
                      <div class="text-[11px] font-bold mt-0.5" style="color: ${d.isToday ? 'var(--accent)' : 'var(--text-primary)'};">${d.dayNum}</div>
                    </th>
                  `).join('')}
                </tr>
              </thead>
              <tbody class="divide-y" style="border-color: var(--border-subtle);">
                ${habits.map(h => {
                  const doneCnt = activeDates.filter(d => h.logs && h.logs[d.iso]).length;
                  const hPct = activeDates.length > 0 ? Math.round((doneCnt / activeDates.length) * 100) : 0;
                  return `
                    <tr>
                      <td class="py-2.5 pr-3 sticky left-0 z-10" style="background-color: var(--bg-surface);">
                        <div class="flex items-center justify-between gap-2">
                          <span class="font-semibold truncate max-w-[125px]">${escapeHtml(h.name)}</span>
                          <div class="flex items-center gap-1.5 shrink-0">
                            <span id="habit-row-pct-${h.id}" class="text-[11px] font-bold" style="color: var(--text-secondary);">${hPct}%</span>
                            <button onclick="deleteHabit('${h.id}')" title="Xóa thói quen" class="opacity-45 hover:opacity-100 text-red-400 cursor-pointer"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                          </div>
                        </div>
                        <div class="h-1 rounded-full overflow-hidden mt-1.5" style="background-color: var(--ring-track);">
                          <div id="habit-row-bar-${h.id}" class="h-full rounded-full transition-all duration-200" style="width:${hPct}%; background-color: var(--accent);"></div>
                        </div>
                      </td>
                      ${datesArr.map(d => {
                        const checked = !!(h.logs && h.logs[d.iso]);
                        return `
                          <td class="px-1 py-2 text-center ${d.isToday ? 'bg-white/10' : d.isWeekend ? 'bg-white/[0.03]' : ''}">
                            <button id="hcell-${h.id}-${d.iso}" ${d.isFuture ? 'disabled' : `onclick="toggleHabitDay('${h.id}', '${d.iso}', event)"`}
                              class="habit-cell ${checked ? 'done' : ''} ${d.isFuture ? 'future' : ''}"
                              title="${h.name} - ${d.dayNum}/${month + 1}">
                              ${checked ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                            </button>
                          </td>
                        `;
                      }).join('')}
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          <form onsubmit="handleAddHabitFromTracker(event)" class="mt-4 pt-3 border-t flex items-center gap-2" style="border-color: var(--border-subtle);">
            <input id="tracker-habit-input" type="text" placeholder="Thêm thói quen mới, ví dụ: Thiền 10 phút" class="planner-input flex-1 px-3.5 py-2 text-xs" />
            <button type="submit" class="planner-pill px-4 py-2 text-xs font-semibold">+ Thêm</button>
          </form>

          <div class="mt-3 flex items-center gap-2 text-xs" style="color: var(--text-secondary);">
            <span>Muốn đặt việc cố định theo thứ (VD mỗi thứ 7)?</span>
            <button onclick="openRecurringModal()" class="font-semibold hover:underline flex items-center gap-1 cursor-pointer" style="color: var(--text-primary);">
              <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
              <span>Dùng Việc lặp lại (${appState.recurringTasks.length})</span>
            </button>
          </div>
        </section>
      `;
    }

    function changeHabitMonth(delta) {
      if (delta === 0) habitMonthOffset = 0;
      else habitMonthOffset += delta;
      renderApp();
    }

    function toggleHabitChartRange() {
      habitChartRange = habitChartRange === '1m' ? '7d' : '1m';
      updateHabitStatsAndChartInPlace();
      const span = document.querySelector('#habit-chart-wrap')?.parentElement?.querySelector('button span');
      if (span) span.textContent = habitChartRange === '1m' ? '1 tháng' : '7 ngày';
    }

    function setHabitChartMode(mode) {
      habitChartMode = mode;
      renderApp();
    }

    function toggleHabitDay(habitId, iso, evt = null) {
      const h = appState.habits.find(x => x.id === habitId);
      if (!h) return;
      if (!h.logs) h.logs = {};
      const todayISO = formatDateISO(getTodayDateObj());
      const prevPct = getTodaySummaryData().overallPct;
      const nextVal = !h.logs[iso];
      if (nextVal) {
        h.logs[iso] = true;
      } else {
        delete h.logs[iso];
      }
      playMicroTickSound(nextVal);
      if (nextVal && evt) {
        triggerMicroSparkle(evt.clientX, evt.clientY);
      }
      saveState();

      if (activeTab === 'habits') {
        const cell = document.getElementById(`hcell-${habitId}-${iso}`);
        if (cell) {
          if (nextVal) {
            cell.classList.add('done');
            cell.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>';
            if (window.lucide) lucide.createIcons({ root: cell });
          } else {
            cell.classList.remove('done');
            cell.innerHTML = '';
          }
        }
        const { datesArr } = getHabitMonthInfo();
        const activeDates = datesArr.filter(d => !d.isFuture);
        const doneCnt = activeDates.filter(d => h.logs && h.logs[d.iso]).length;
        const hPct = activeDates.length > 0 ? Math.round((doneCnt / activeDates.length) * 100) : 0;
        const pctEl = document.getElementById(`habit-row-pct-${habitId}`);
        const barEl = document.getElementById(`habit-row-bar-${habitId}`);
        if (pctEl) pctEl.textContent = `${hPct}%`;
        if (barEl) barEl.style.width = `${hPct}%`;
        updateHabitStatsAndChartInPlace();
      } else if (activeTab === 'today') {
        renderTodayHabitsInPlace();
      } else {
        renderApp();
      }

      if (iso === todayISO && nextVal && prevPct < 100 && getTodaySummaryData().overallPct === 100) {
        triggerAllTodayCelebration();
      } else if (iso === todayISO && !nextVal) {
        lastCelebratedPerfectDayISO = null;
      }
    }

    function handleAddHabitFromTracker(e) {
      e.preventDefault();
      const inp = document.getElementById('tracker-habit-input');
      const name = inp.value.trim();
      if (!name) return;
      appState.habits.push({ id: uid('h'), name, logs: {} });
      inp.value = '';
      saveState();
      playMicroTickSound(true);
      renderApp();
      showToast('Đã thêm thói quen mới');
    }

    function deleteHabit(id) {
      appState.habits = appState.habits.filter(h => h.id !== id);
      saveState();
      renderApp();
      showToast('Đã xóa thói quen');
    }

    /* =========================================================================
       4. TAB: KẾ HOẠCH TUẦN
       ========================================================================= */
    function renderWeekView() {
      const today = getTodayDateObj();
      const todayISO = formatDateISO(today);
      const monday = getMondayOfWeek(today, weekOffset);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const weekNum = getISOWeekNumber(monday);
      const weekKey = formatDateISO(monday);

      const daysOfWeek = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const iso = formatDateISO(d);
        const dayTasks = appState.tasks.filter(t => t.date === iso);
        daysOfWeek.push({
          dateObj: d,
          iso,
          dayName: getFullDayNameVN(d),
          shortDay: getDayNameVN(d),
          shortDate: formatShortVN(iso),
          isToday: iso === todayISO,
          isFuture: iso > todayISO,
          tasks: dayTasks
        });
      }

      const allWeekTasks = daysOfWeek.flatMap(d => d.tasks);
      const weekDoneTasks = allWeekTasks.filter(t => t.done).length;
      const todayTasksCount = appState.tasks.filter(t => t.date === todayISO).length;

      let hDone = 0;
      let hTotal = 0;
      daysOfWeek.forEach(d => {
        if (!d.isFuture) {
          hTotal += appState.habits.length;
          hDone += appState.habits.filter(h => h.logs && h.logs[d.iso]).length;
        }
      });
      const weekHabitPct = hTotal > 0 ? Math.round((hDone / hTotal) * 100) : 0;

      const chartLabels = daysOfWeek.map(d => d.shortDay);
      const chartDone = daysOfWeek.map(d => d.isFuture ? null : d.tasks.filter(t => t.done).length);
      const chartTotal = daysOfWeek.map(d => d.tasks.length);
      const weekNoteVal = appState.weekNotes[weekKey] || '';

      return `
        <section class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
          <div>
            <h1 class="text-2xl sm:text-[28px] font-extrabold tracking-tight">Kế hoạch tuần</h1>
            <p class="text-xs sm:text-sm mt-0.5" style="color: var(--text-secondary);">Tuần ${weekNum} &bull; ${formatShortVN(formatDateISO(monday))} &ndash; ${formatDateVN(formatDateISO(sunday))}</p>
            <div class="flex items-center gap-2 mt-3">
              <button onclick="changeWeekOffset(-1)" class="planner-pill p-2"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
              <button onclick="changeWeekOffset(0)" class="planner-pill px-3.5 py-1.5 text-xs font-semibold">${weekOffset === 0 ? 'Tuần này' : `Tuần ${weekNum}`}</button>
              <button onclick="changeWeekOffset(1)" class="planner-pill p-2"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>
          </div>

          <div class="space-y-2">
            <div class="planner-card px-5 py-3.5 grid grid-cols-3 gap-5">
              <div>
                <div class="text-[10px] uppercase tracking-wider flex items-center gap-1" style="color: var(--text-secondary);">
                  <i data-lucide="check-circle-2" class="w-3 h-3"></i> ĐÃ XONG
                </div>
                <div class="text-xl sm:text-2xl font-extrabold mt-1">${weekDoneTasks}<span class="text-xs font-normal opacity-60">/${allWeekTasks.length}</span></div>
              </div>
              <div>
                <div class="text-[10px] uppercase tracking-wider flex items-center gap-1" style="color: var(--text-secondary);">
                  <i data-lucide="circle-dot" class="w-3 h-3"></i> THÓI QUEN
                </div>
                <div class="text-xl sm:text-2xl font-extrabold mt-1">${weekHabitPct}%</div>
              </div>
              <div>
                <div class="text-[10px] uppercase tracking-wider flex items-center gap-1" style="color: var(--text-secondary);">
                  <i data-lucide="sparkles" class="w-3 h-3"></i> HÔM NAY
                </div>
                <div class="text-xl sm:text-2xl font-extrabold mt-1">${todayTasksCount} <span class="text-xs font-normal">việc</span></div>
              </div>
            </div>
            <p class="text-[11px] max-w-[340px]" style="color: var(--text-secondary);">
              Đã có tiến bộ. Tuần sau thử đặt ít việc hơn nhưng chắc chắn hơn.
            </p>
          </div>
        </section>

        <section class="planner-card p-4 sm:p-5">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2.5">
              <h2 class="text-sm sm:text-base font-bold">Tiến độ từng ngày</h2>
              <span class="planner-pill px-2.5 py-1 text-xs font-medium flex items-center gap-1">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i> 1 tuần
              </span>
            </div>
            <div class="flex items-center gap-3">
              <div class="hidden sm:flex items-center gap-3 text-xs" style="color: var(--text-secondary);">
                <span class="flex items-center gap-1"><span class="w-2.5 h-0.5 inline-block" style="background: var(--chart-line);"></span> Đã xong</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-0.5 inline-block" style="background: var(--chart-sub);"></span> Tổng việc</span>
              </div>
              <div class="flex items-center p-0.5 rounded-xl border" style="border-color: var(--border-main); background-color: var(--bg-surface-2);">
                <button onclick="setWeekChartMode('line')" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${weekChartMode === 'line' ? 'planner-pill-active' : ''}">Đường</button>
                <button onclick="setWeekChartMode('bar')" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${weekChartMode === 'bar' ? 'planner-pill-active' : ''}">Cột</button>
              </div>
            </div>
          </div>

          ${buildSmoothAreaChartSVG({
            labels: chartLabels,
            primarySeries: chartDone,
            secondarySeries: chartTotal,
            maxY: Math.max(10, ...chartTotal),
            height: 155,
            highlightLast: false,
            mode: weekChartMode
          })}
        </section>

        <section class="planner-card p-4 sm:p-5">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-sm font-bold flex items-center gap-2">
              <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
              <span>Ghi chú tuần</span>
            </h2>
            <span class="text-[10px]" style="color: var(--text-muted);">Tự động lưu</span>
          </div>
          <textarea oninput="saveWeekNote('${weekKey}', this.value)" rows="2" placeholder="Nhập trọng tâm hoặc ghi chú cho tuần này..." class="planner-input w-full p-3 text-xs leading-relaxed">${escapeHtml(weekNoteVal)}</textarea>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-7 gap-3">
          ${daysOfWeek.map(d => {
            const doneCnt = d.tasks.filter(t => t.done).length;
            return `
              <div class="planner-card p-3 flex flex-col justify-between min-h-[250px] ${d.isToday ? 'ring-1 ring-white/50' : ''}">
                <div>
                  <div class="flex items-center justify-between pb-2 mb-2.5 border-b" style="border-color: var(--border-subtle);">
                    <div>
                      <div class="text-xs font-bold ${d.isToday ? 'underline' : ''}">${d.dayName}</div>
                      <div class="text-[10px]" style="color: var(--text-muted);">${d.shortDate}</div>
                    </div>
                    <span class="text-[11px] font-bold" style="color: var(--text-secondary);">${doneCnt}/${d.tasks.length}</span>
                  </div>

                  <div class="space-y-2">
                    ${d.tasks.map(t => `
                      <div class="flex items-start gap-2 text-xs group">
                        <button onclick="toggleTaskDone('${t.id}', event)" class="custom-check !w-4 !h-4 !min-w-[16px] mt-0.5 ${t.done ? 'checked' : ''}">
                          ${t.done ? '<i data-lucide="check" class="w-2.5 h-2.5 stroke-[3]"></i>' : ''}
                        </button>
                        <span onclick="openEditTaskModal('${t.id}')" class="leading-snug cursor-pointer flex-1 ${t.done ? 'line-through opacity-50' : ''}">${escapeHtml(t.title)}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <form onsubmit="handleAddWeekDayTask(event, '${d.iso}')" class="mt-3 pt-2 border-t flex items-center gap-1" style="border-color: var(--border-subtle);">
                  <input type="text" placeholder="+ Việc..." class="planner-input w-full px-2 py-1 text-[11px]" />
                </form>
              </div>
            `;
          }).join('')}
        </section>
      `;
    }

    function changeWeekOffset(delta) {
      if (delta === 0) weekOffset = 0;
      else weekOffset += delta;
      renderApp();
    }

    function setWeekChartMode(mode) {
      weekChartMode = mode;
      renderApp();
    }

    function saveWeekNote(weekKey, val) {
      appState.weekNotes[weekKey] = val;
      saveState();
    }

    function handleAddWeekDayTask(e, iso) {
      e.preventDefault();
      const inp = e.target.querySelector('input');
      const title = inp.value.trim();
      if (!title) return;
      appState.tasks.push({ id: uid('t'), title, date: iso, priority: '', done: false, pomodoroCount: 0, subtasks: [] });
      saveState();
      playMicroTickSound(true);
      renderApp();
    }

    /* =========================================================================
       5. TAB: KẾ HOẠCH NĂM
       ========================================================================= */
    function ensureAnnualYearData(yr) {
      if (!appState.annualPlans[yr]) {
        const months = {};
        for (let m = 1; m <= 12; m++) months[m] = [];

        return {
          name: h.name,
          rate: habits.length > 0 && recentCount === 0 ? 0 : rate,
          doneDays: recentCount + (recentCount > 0 ? 15 : 0),
          totalDays: 36,

      const allGoals = appState.goals || [];

        const p = getGoalProgress(g);
        return p > 0 && p < 100;
      }).length;
      const notStartedGoals = allGoals.filter(g => getGoalProgress(g) === 0).length;
      const goalsDonePct = allGoals.length > 0 ? Math.round((completedGoals / allGoals.length) * 100) : 0;

        const d = new Date(today);

            </div>

            <div class="space-y-4">
              ${habitStats.length === 0 ? `<div class="text-xs" style="color: var(--text-muted);">Chưa có dữ liệu thói quen.</div>` : ''}
              ${habitStats.map(hs => `
                <div>
                  <div class="flex items-center justify-between text-xs mb-1">
                    <span class="font-bold">${escapeHtml(hs.name)}</span>
                    <span class="font-extrabold">${hs.rate}%</span>
                  </div>
                  <div class="h-2 rounded-full overflow-hidden" style="background-color: var(--ring-track);">
                    <div class="h-full rounded-full" style="width:${hs.rate}%; background-color: var(--accent);"></div>
                  </div>
                  <div class="text-[10px] mt-1" style="color: var(--text-muted);">
                    ${hs.doneDays}/${hs.totalDays} ngày &bull; chuỗi hiện tại <strong>${hs.curStreak}</strong> &bull; dài nhất <strong>${hs.maxStreak}</strong>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="planner-card p-5">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h2 class="text-base font-bold">Mục tiêu của bạn</h2>
                <p class="text-xs mt-0.5" style="color: var(--text-secondary);">${allGoals.length} mục tiêu &bull; ${goalsDonePct}% đã hoàn thành</p>
              </div>
              <button onclick="switchTab('goals')" class="text-xs font-semibold hover:underline cursor-pointer" style="color: var(--text-secondary);">Bảng</button>
            </div>

            <div class="h-3 rounded-full overflow-hidden flex gap-0.5 mb-2.5" style="background-color: var(--ring-track);">
              <div style="width:${allGoals.length ? (notStartedGoals / allGoals.length) * 100 : 0}%; background-color: var(--heat-1);"></div>
              <div style="width:${allGoals.length ? (inProgressGoals / allGoals.length) * 100 : 0}%; background-color: var(--heat-2);"></div>
              <div style="width:${allGoals.length ? (completedGoals / allGoals.length) * 100 : 0}%; background-color: var(--accent);"></div>
            </div>

            <div class="flex flex-wrap items-center gap-4 text-[11px] mb-5" style="color: var(--text-secondary);">
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background: var(--heat-1);"></span> Chưa bắt đầu <strong>${notStartedGoals}</strong></span>
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background: var(--heat-2);"></span> Đang thực hiện <strong>${inProgressGoals}</strong></span>
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background: var(--accent);"></span> Đã hoàn thành <strong>${completedGoals}</strong></span>
            </div>

            <div class="text-xs font-bold mb-3" style="color: var(--text-secondary);">Theo lĩnh vực</div>
            <div class="space-y-3.5">
              ${domainRows.map(dr => {
                const matched = allGoals.filter(g => dr.keys.includes(g.category));
                const doneCnt = matched.filter(g => getGoalProgress(g) === 100).length;
                const dPct = matched.length > 0 ? Math.round((doneCnt / matched.length) * 100) : 0;
                return `
                  <div>
                    <div class="flex items-center justify-between text-xs mb-1">
                      <span class="font-semibold">${dr.label}</span>
                      <span style="color: var(--text-secondary);">${doneCnt}/${matched.length} xong</span>
                    </div>
                    <div class="h-1.5 rounded-full overflow-hidden" style="background-color: var(--ring-track);">
                      <div class="h-full rounded-full" style="width:${dPct}%; background-color: var(--accent);"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </section>
      `;
    }

    function toggleStatsRange() {
      statsWeeksRange = statsWeeksRange === 8 ? 12 : 8;
      renderApp();
    }

    function setStatsTrendMode(mode) {
      statsTrendMode = mode;
      renderApp();
    }

    function exportDataJSON() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(appState, null, 2));
      const a = document.createElement('a');
      a.setAttribute('href', dataStr);
      a.setAttribute('download', `pandaplanner-backup-${formatDateISO(getTodayDateObj())}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Đã tải xuống tệp sao lưu JSON');
    }

    function importDataJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed && typeof parsed === 'object' && Array.isArray(parsed.tasks)) {
            appState = parsed;
            saveState();
            applyTheme(appState.theme || 'dark');
            updateSoundToggleUI();
            updatePomodoroUI();
            renderApp();
            showToast('Đã khôi phục dữ liệu từ tệp JSON');
          } else {
            showToast('Tệp JSON không đúng định dạng PandaPlanner');
          }
        } catch (err) {
          showToast('Lỗi đọc tệp JSON');
        }
      };
      reader.readAsText(file);
    }

    /* =========================================================================
       MAIN RENDER LOOP & KEYBOARD SHORTCUTS
       ========================================================================= */
    function renderApp(animate = false) {
      const scrollX = window.scrollX;
      const scrollY = window.scrollY;
      renderNavigation();
      const container = document.getElementById('app-content');
      if (!container) return;

      let html = '';
      if (activeTab === 'today') html = renderTodayView();
      else if (activeTab === 'goals') html = renderGoalsView();
      else if (activeTab === 'habits') html = renderHabitsView();
      else if (activeTab === 'week') html = renderWeekView();
      else if (activeTab === 'year') html = renderYearView();
      else if (activeTab === 'stats') html = renderStatsView();

      container.innerHTML = `<div class="${animate ? 'tab-animate-in ' : ''}space-y-5">${html}</div>`;
      if (window.lucide) lucide.createIcons();
      if (!animate) {
        window.scrollTo(scrollX, scrollY);
      }
    }

    document.getElementById('mobile-menu-btn').addEventListener('click', openMobileSidebar);
    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
      const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

      if (e.key === 'Escape') {
        closeModal();
        closeLongGoalCelebration();
        togglePomodoroDrawer(false);
        return;
      }

      if (isTyping || e.ctrlKey || e.metaKey || e.altKey) return;

      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        openAddTaskModal(formatDateISO(getTodayDateObj()));
      } else if (key === 'p') {
        e.preventDefault();
        togglePomodoroDrawer();
      } else if (['1', '2', '3', '4', '5', '6'].includes(key)) {
        const idx = Number(key) - 1;
        if (NAV_ITEMS[idx]) switchTab(NAV_ITEMS[idx].id);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      initPWAAppCapabilities();
      loadState();
      applyTheme(appState.theme);
      updateSoundToggleUI();
      updatePomodoroUI();
      resizeFxCanvas();
      renderApp();
      updateSyncStatusUI('local');
      if (window.__firebaseSDK) {
        initFirebaseCloud();
      } else {
        window.addEventListener('firebase-sdk-ready', initFirebaseCloud, { once: true });
      }
    });

    /* =========================================================================
       PROGRESSIVE WEB APP (PWA) - INSTALLABLE APP & OFFLINE SERVICE WORKER
       ========================================================================= */
    let deferredInstallPrompt = null;

    function initPWAAppCapabilities() {
      const appIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#020617"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#bg)"/>
        <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#38bdf8" stroke-width="10" stroke-opacity="0.45"/>
        <circle cx="155" cy="145" r="44" fill="#38bdf8"/>
        <circle cx="357" cy="145" r="44" fill="#38bdf8"/>
        <rect x="115" y="135" width="282" height="255" rx="88" fill="#f8fafc"/>
        <ellipse cx="195" cy="245" rx="32" ry="40" fill="#0f172a"/>
        <ellipse cx="317" cy="245" rx="32" ry="40" fill="#0f172a"/>
        <circle cx="203" cy="235" r="10" fill="#38bdf8"/>
        <circle cx="325" cy="235" r="10" fill="#38bdf8"/>
        <path d="M236 298 Q256 318 276 298" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
        <path d="M188 352 L236 392 L332 296" fill="none" stroke="#10b981" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

      const encodedIcon = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(appIconSvg);
      const favEl = document.getElementById('pwa-favicon');
      const appleEl = document.getElementById('pwa-apple-icon');
      if (favEl) favEl.href = encodedIcon;
      if (appleEl) appleEl.href = encodedIcon;

      const manifestObj = {
        name: 'PandaPlanner - Quản lý Kế hoạch, Mục tiêu & Thói quen',
        short_name: 'PandaPlanner',
        description: 'Ứng dụng lập kế hoạch ngày, theo dõi thói quen, mục tiêu ngắn hạn/dài hạn và Pomodoro tập trung.',
        start_url: window.location.href,
        display: 'standalone',
        orientation: 'any',
        background_color: '#0d0d0d',
        theme_color: '#0d0d0d',
        icons: [
          {
            src: encodedIcon,
            sizes: '192x192 512x512',
            type: 'image/svg+xml',
            purpose: 'any maskable'
          }
        ]
      };

      try {
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.getElementById('pwa-manifest-link');
        if (manifestLink) manifestLink.href = manifestUrl;
      } catch (e) {}

      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        const swCode = `
          const CACHE_NAME = 'pandaplanner-app-v1';
          self.addEventListener('install', (e) => { self.skipWaiting(); });
          self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); });
          self.addEventListener('fetch', (e) => {
            if (e.request.method !== 'GET') return;
            e.respondWith(
              fetch(e.request)
                .then((res) => {
                  const copy = res.clone();
                  caches.open(CACHE_NAME).then((cache) => cache.put(e.request, copy)).catch(() => {});
                  return res;
                })
                .catch(() => caches.match(e.request))
            );
          });
        `;
        try {
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        } catch (e) {}
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        const btn = document.getElementById('pwa-install-btn');
        if (btn) btn.classList.remove('hidden');
      });

      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        showToast('Đã cài đặt PandaPlanner thành công ra màn hình chính!');
      });
    }

    async function triggerAppInstall() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        if (outcome === 'accepted') {
          deferredInstallPrompt = null;
          showToast('Đang cài đặt ứng dụng PandaPlanner...');
        }
        return;
      }

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl bg-sky-400/20 text-sky-400 flex items-center justify-center shrink-0 border border-sky-400/30">
                <i data-lucide="smartphone" class="w-6 h-6"></i>
              </div>
              <div>
                <h3 class="text-base font-extrabold">Cài đặt PandaPlanner thành App</h3>
                <p class="text-[11px]" style="color: var(--text-secondary);">Chạy toàn màn hình, có biểu tượng riêng và hoạt động mượt mà như ứng dụng gốc</p>
              </div>
            </div>
            <button onclick="closeModal()" class="p-1 opacity-70 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <div class="space-y-2.5 text-xs">
            <div class="p-3 rounded-xl border space-y-1" style="background-color: var(--bg-surface-2); border-color: var(--border-subtle);">
              <div class="font-bold flex items-center gap-1.5 text-sky-400">
                <i data-lucide="monitor" class="w-3.5 h-3.5"></i> Trên máy tính (Chrome / Cốc Cốc / Edge):
              </div>
              <p style="color: var(--text-secondary);">
                1. Mở trang web bằng đường link trực tiếp (ví dụ đường link Netlify của bạn).<br/>
                2. Bấm vào biểu tượng <strong>Cài đặt ứng dụng (màn hình có mũi tên tải xuống)</strong> ở góc phải thanh địa chỉ trình duyệt, hoặc vào Menu (⋮) &rarr; <strong>Lưu và chia sẻ</strong> &rarr; <strong>Cài đặt PandaPlanner...</strong>
              </p>
            </div>

            <div class="p-3 rounded-xl border space-y-1" style="background-color: var(--bg-surface-2); border-color: var(--border-subtle);">
              <div class="font-bold flex items-center gap-1.5 text-emerald-400">
                <i data-lucide="smartphone" class="w-3.5 h-3.5"></i> Trên điện thoại (${isIOS ? 'iPhone / iPad Safari' : 'Android / iOS'}):
              </div>
              <p style="color: var(--text-secondary);">
                &bull; <strong>Android (Chrome):</strong> Bấm dấu 3 chấm (⋮) góc trên &rarr; <strong>Thêm vào màn hình chính (Install App)</strong>.<br/>
                &bull; <strong>iPhone / iPad (Safari):</strong> Bấm nút <strong>Chia sẻ (Share)</strong> ở thanh dưới &rarr; chọn <strong>Thêm vào MH chính (Add to Home Screen)</strong>.
              </p>
            </div>
          </div>

          <div class="flex items-center justify-between gap-2 pt-2">
            <button onclick="downloadOfflineHTML(); closeModal();" class="planner-pill px-3.5 py-2 text-xs font-semibold flex items-center gap-1.5">
              <i data-lucide="hard-drive-download" class="w-3.5 h-3.5 text-sky-400"></i>
              <span>Tải tệp chạy Offline</span>
            </button>
            <button onclick="closeModal()" class="planner-pill planner-pill-active px-4 py-2 text-xs font-bold">Đã hiểu</button>
          </div>
        </div>
      `);
    }
  </script>
</body>
</html>
